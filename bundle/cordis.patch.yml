- id: "webserver"
  disable: true

- id: "agent-presets"
  disable: true

- insert:
  - name: "@noirhare/dsh-host-webserver"
    inject:
      - webStartup
    config:
      host: !!js ctx.webStartup.host ?? '127.0.0.1'
      port: !!js ctx.webStartup.port ?? 3080

  - name: "@noirhare/dsh-agent-presets"
    config:
      default: standard

  - name: "@norihare/dsh-nr-agent-presets"