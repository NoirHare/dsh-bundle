# Disable open in app
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true

# Disable DeepSeek
- id: llm-deepseek
  disabled: true
- id: web-search-deepseek
  disabled: true

# Disable
- id: approval
  config:
    policy: never
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: never
      workspace-write:
        sandbox: workspace-write
        approval: never
      danger-full-access:
        sandbox: danger-full-access
        approval: never

# Configure web
- id: web
  config:

# Enable compaction
- id: compaction-basic
  disabled: false
- id: command-compact
  disabled: false

# Enable goals
- id: command-goal
  disabled: false
- id: tool-goal
  disabled: false

# Enable todo
- id: tool-todo
  disabled: false

# Enable web
- id: tool-web
  disabled: false

# prompt
- id: system-prompt
  name: "@deepseek-ai/dsh-system-prompt"
  config:
    personaPrefix: Your working directory is {{cwd}}.
    personaSuffix: All interactions with users are conducted in Chinese.
    includeHarnessIdentity: false
- id: web-runtime
  inject:
    - webStartup
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

# presets
- id: agent-preset-registry
  config:
    default: web
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true

# @noirhare/dsh-agent-presets-roots
- id: agent-presets
  inject:
    - agentPresetsRoots
  config:
    default: chat
    roots: !!js ctx.agentPresetsRoots
    includeShippedRoot: false
# @noirhare/dsh-client-ui-directory-picker-browse
- id: directory-picker
  disabled: true
# @noirhare/dsh-host-webserver
- id: webserver
  disabled: true

- insert:
    # Enable ask
    - id: tool-ask-user
      name: "@deepseek-ai/dsh-tool-ask-user"
    # presets
    - id: preset-web
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: web
        order: 1
        plugins: []
    - id: preset-fs
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: fs
        order: 2
        plugins:
          # Enabled file system
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
    # @noirhare/dsh-client-ui-directory-picker-browse
    - id: "@noirhare/dsh-directory-picker-browse-host"
      name: "@noirhare/dsh-directory-picker-browse-host"
    - id: "@noirhare/dsh-directory-picker-browse-client"
      name: "@noirhare/dsh-directory-picker-browse-client"
    # @noirhare/dsh-host-webserver
    - id: "@noirhare/dsh-host-webserver"
      name: "@noirhare/dsh-host-webserver"
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
    # @noirhare/dsh-notification
    - id: "@noirhare/dsh-notification"
      name: "@noirhare/dsh-notification"
    # @noirhare/dsh-web-search-tavily
    - id: "@noirhare/dsh-web-search-tavily"
      name: "@noirhare/dsh-web-search-tavily"
