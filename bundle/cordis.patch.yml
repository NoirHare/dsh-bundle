- id: "webserver"
  disabled: true

- id: "agent-presets"
  disabled: true

- insert:
  - name: "@deepseek-ai/dsh-web-fetch-http"
  
  - name: "@noirhare/dsh-host-webserver"
    inject:
      - webStartup
    config:
      host: !!js ctx.webStartup.host ?? '127.0.0.1'
      port: !!js ctx.webStartup.port ?? 3080

  - name: "@noirhare/dsh-agent-presets"
    config:
      default: standard

  - name: "@noirhare/dsh-nr-agent-presets"
  - name: "@noirhare/dsh-ui-notification"